[project]
name = "email-agent-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.3",
    "cryptography>=50.0.2",
    "fastapi>=0.162.1",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.1",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "mcp>=2.3.0",
    "openai>=3.46.0",
    "pydantic-settings>=2.16.2",
    "pywebpush>=2.5.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

pythonpath = ["."]

